# Danske vinforhandlere med webshop, der scannes.
#
# Felter:
#   name                 (påkrævet) navn som vist på siden
#   url                  (påkrævet) webshoppens forside
#   platform             auto | shopify | woocommerce | generic   (auto = find selv, standard)
#   city                 by / område (vises i oversigten)
#   note                 kort beskrivelse
#   offer_urls           sider med tilbud – produkter linket herfra hentes først (kun 'generic')
#   product_url_pattern  regex der matcher produkt-URL'er i sitemap (kun 'generic', valgfri)
#   max_pages            maks. produktsider pr. kørsel (kun 'generic', overskriver config)
#   enabled              false = spring over
#
# Platformen findes automatisk ved første kørsel (python -m vinjagt detect).
# Forhandlere der ikke kan scannes vises med status i oversigten på hjemmesiden.

